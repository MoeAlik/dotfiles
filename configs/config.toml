[aerospace]
systems = ["Darwin"]

[[aerospace.files]]
path = "~/.config/aerospace/aerospace.toml"
project_path = "aerospace.toml"

[zprofile]
systems = ["Darwin"]

[[zprofile.files]]
path = "~/.zprofile"
project_path = "zprofile"

[gitconfig]
systems = ["Darwin", "Linux"]

[[gitconfig.files]]
path = "~/.gitconfig"
project_path = "gitconfig"

[simple-bar]
systems = ["Darwin"]

[[simple-bar.files]]
path = "~/.config/ubersicht/widgets/simple-bar/.simplebarrc"
project_path = "simplebarrc"

[bashrc]
systems = ["Linux"]

[[bashrc.files]]
path = "~/.bashrc"
project_path = "bashrc"

[sketchybar]
systems = ["Darwin"]

[[sketchybar.files]]
path = "~/.config/sketchybar/sketchybarrc"
project_path = "sketchybarrc"

[vscode]
systems = ["Linux", "Darwin"]

[[vscode.files]]
path = "~/Library/Application Support/Code/User/settings.json"
project_path = "settings.json"

[[vscode.files]]
project_path = "extensions.txt"

[[vscode.commands]]
project_path = "install"

[[vscode.commands]]
project_path = "load"
